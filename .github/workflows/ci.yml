name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Scoped to FreelanceOS code for now: the rest of the repo has
      # pre-existing lint errors. Widen to `npm run lint` once those are fixed.
      - run: npm run lint:app
      - run: npm test
